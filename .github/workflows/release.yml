---
name: Release
# Cut a GitHub Release once every published stable image has been rebuilt on
# the newest stable bazzite release. The decision lives in
# .github/scripts/release-gate.sh; this file only runs it and publishes.
on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    name: Release if due
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      # --generate-notes lists merged PRs; without this the create call 403s
      # with "Resource not accessible by integration".
      pull-requests: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      UPSTREAM_REPO: ublue-os/bazzite
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Decide
        id: gate
        run: |
          set -euo pipefail
          # Same variant list the build uses, so a new variant is covered here
          # without a second copy to keep in sync.
          VARIANTS="$(yq -r '.jobs.matrix.steps[] | select(.id == "gen") | .env.VARIANTS' .github/workflows/build.yml)"
          export VARIANTS
          result="$(.github/scripts/release-gate.sh)"
          jq . <<<"${result}"
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
          if [[ "$(jq -r .release <<<"${result}")" == "true" ]]; then
            echo "**Releasing $(jq -r .tag <<<"${result}")** - $(jq -r .reason <<<"${result}")" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "**No release** - $(jq -r .reason <<<"${result}")" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Create release
        if: fromJSON(steps.gate.outputs.result).release
        env:
          RESULT: ${{ steps.gate.outputs.result }}
        run: |
          set -euo pipefail
          tag="$(jq -r .tag <<<"${RESULT}")"
          source="$(jq -r .source_commit <<<"${RESULT}")"
          url="$(jq -r .upstream_url <<<"${RESULT}")"
          prev="$(jq -r .prev_tag <<<"${RESULT}")"
          registry="ghcr.io/${OWNER,,}"

          {
            echo "Freizzite rebuilt on [Bazzite ${tag}](${url}); see that release for what changed in the base."
            echo "Images built from [\`${source:0:7}\`](https://github.com/${REPO}/commit/${source})."
            echo
            echo "| Image | Pinned ref |"
            echo "| --- | --- |"
            jq -r --arg r "${registry}" \
              '.images[] | "| \(.name) | `\($r)/\(.name)@\(.digest)` |"' <<<"${RESULT}"
            echo
            echo "Pin a machine to this release with \`sudo bootc switch <pinned ref>\`."
            echo
          } > notes.md

          # The tag lands on the branch tip, not on the images' source commit:
          # GITHUB_TOKEN may not create a ref whose workflow files differ from
          # the default branch ("refusing to allow a GitHub App to create or
          # update workflow ... without `workflows` permission"), and renovate
          # bumps workflow files often enough that an older commit usually
          # differs. The source commit is recorded in the notes instead. A PAT
          # with `workflows` scope would allow tagging the exact commit.
          args=(--target "${GITHUB_REF_NAME}" --title "${tag}" --notes-file notes.md --generate-notes)
          [[ -n "${prev}" ]] && args+=(--notes-start-tag "${prev}")
          gh release create "${tag}" "${args[@]}"
          echo "Released ${tag} (images from ${source:0:7}): $(gh release view "${tag}" --json url -q .url)" >> "${GITHUB_STEP_SUMMARY}"
